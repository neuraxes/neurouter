name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/neuraxes/neurouter

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Install pinned tools
        run: make init
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Go files requiring formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check Protobuf formatting
        run: buf format --diff --exit-code
      - name: Run lint
        run: buf lint && go vet ./...
      - name: Run tests
        run: go test ./... -v

  BuildImage:
    runs-on: ${{ matrix.runner }}
    needs: Test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: neurouter-${{ matrix.arch }}
          path: ./bin/neurouter
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image and publish on main
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Export image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "${RUNNER_TEMP}/digests/${IMAGE_ARCH}"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  PublishImage:
    runs-on: ubuntu-latest
    needs: BuildImage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "$arch")
            sources+=("${IMAGE_NAME}@${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}" \
            --tag "${IMAGE_NAME}:latest" \
            "${sources[@]}"
